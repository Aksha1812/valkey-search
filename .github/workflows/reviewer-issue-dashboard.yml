# Living Triage Board (issue-based)
#
# Regenerates the dashboard issue body from open PRs and applies command
# comments (/done, /note, /priority, /claim, …), deleting each command comment
# after it's processed so the issue stays fast.
#
# Runs on three triggers:
#   * schedule (*/5)        — keep PR data fresh.
#   * issue_comment created — apply a reviewer's command within seconds.
#   * workflow_dispatch     — manual run, optional target_repo override.
#
# One-time setup:
#   * Create the dashboard issue; set repo variable DASHBOARD_ISSUE to its number.
#   * Optional: set repo variable TARGET_REPO (owner/name) to read a different
#     repo's PRs (e.g. valkey-io/valkey-search for a fork demo).

name: Reviewer Issue Dashboard

on:
  schedule:
    - cron: '*/5 * * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Read PRs from this owner/name instead of TARGET_REPO/this repo.'
        required: false
        default: ''

concurrency:
  group: reviewer-issue-dashboard
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  build:
    # For comment events, only react to the dashboard issue itself.
    # For comment events, only react to the board issue itself, and only to
    # comments from repository collaborators/maintainers — a non-collaborator's
    # command shouldn't spin up a run. The in-script gate still rejects and
    # cleans up any such comment on the next scheduled sweep.
    if: >-
      ${{ github.event_name != 'issue_comment' ||
          (github.event.issue.number == fromJSON(vars.DASHBOARD_ISSUE) &&
           contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dashboard
        uses: actions/github-script@v7
        env:
          DASHBOARD_ISSUE: ${{ vars.DASHBOARD_ISSUE }}
          TARGET_REPO: ${{ inputs.target_repo || vars.TARGET_REPO }}
          POOLS_PATH: .github/reviewer-pools.json
          RELEASE_LABEL: ''
        with:
          script: |
            const build = require('./.github/scripts/build-issue-dashboard.js');
            await build({ github, context, core });
