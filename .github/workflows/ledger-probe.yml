name: Ledger Permission Probe

# Throwaway: proves whether the built-in GITHUB_TOKEN can read/write repository
# variables under `permissions: actions: write`. Run via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const name = 'PROBE_TEST_VAR';
            const step = async (label, fn) => {
              try {
                const r = await fn();
                core.info('OK   ' + label + '  status=' + (r && r.status));
              } catch (e) {
                core.error('FAIL ' + label + '  status=' + e.status + '  msg=' + e.message);
              }
            };
            await step('POST create', () => github.request(
              'POST /repos/{owner}/{repo}/actions/variables',
              { owner, repo, name, value: '{"hello":1}' }));
            await step('GET read', () => github.request(
              'GET /repos/{owner}/{repo}/actions/variables/{name}',
              { owner, repo, name }));
            await step('PATCH update', () => github.request(
              'PATCH /repos/{owner}/{repo}/actions/variables/{name}',
              { owner, repo, name, value: '{"hello":2}' }));
            await step('DELETE cleanup', () => github.request(
              'DELETE /repos/{owner}/{repo}/actions/variables/{name}',
              { owner, repo, name }));
